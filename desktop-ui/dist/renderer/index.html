<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline';" />
  <title>ZYRA - AI Assistant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .laptop-bezel {
      width: 1420px;
      height: 900px;
      background: #1a1a1e;
      border-radius: 16px 16px 12px 12px;
      padding: 14px;
      position: relative;
      box-shadow:
        0 0 0 2px #2a2a30,
        0 0 0 4px #111115,
        0 20px 60px rgba(0,0,0,0.8),
        inset 0 0 30px rgba(0,0,0,0.3);
    }
    .laptop-bezel::before {
      content: '';
      position: absolute;
      top: 14px; left: 14px; right: 14px; bottom: 14px;
      border-radius: 6px;
      background: #0c0c12;
      z-index: 0;
    }
    .laptop-bezel::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, transparent, #333, transparent);
      border-radius: 0 0 4px 4px;
    }
    .hinge-left, .hinge-right {
      position: absolute;
      top: -6px;
      width: 18px;
      height: 10px;
      background: #222;
      border-radius: 4px 4px 0 0;
      z-index: 2;
    }
    .hinge-left { left: 160px; }
    .hinge-right { right: 160px; }

    .loq-logo {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #555;
      z-index: 5;
      text-transform: uppercase;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      overflow: hidden;
      z-index: 1;
      background: #0c0c14;
    }

    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 48px);
      z-index: 1;
      display: block;
    }

    .taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: rgba(20, 20, 28, 0.85);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
    }

    .taskbar-icons {
      display: flex;
      align-items: center;
      gap: 10px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .taskbar-icon {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: rgba(255,255,255,0.7);
      position: relative;
    }
    .taskbar-icon:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
    .taskbar-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .taskbar-icon .active-indicator {
      position: absolute;
      bottom: 3px;
      width: 12px;
      height: 3px;
      background: #3b82f6;
      border-radius: 2px;
    }

    .system-tray {
      position: absolute;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.7);
    }
    .tray-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255,255,255,0.65);
    }
    .tray-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .clock-display {
      text-align: right;
      line-height: 1.15;
      cursor: pointer;
      padding-left: 8px;
      border-left: 1px solid rgba(255,255,255,0.08);
    }
    .clock-display .time {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.3px;
    }
    .clock-display .date {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.2px;
    }

    .desktop-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 48px;
      z-index: 0;
      background:
        radial-gradient(ellipse at 50% 55%, rgba(255, 160, 40, 0.04) 0%, transparent 65%),
        radial-gradient(ellipse at 50% 30%, rgba(255, 120, 20, 0.02) 0%, transparent 50%),
        linear-gradient(180deg, #0a0a14 0%, #0e0e1a 40%, #0c0c16 100%);
      overflow: hidden;
    }

    .lab-equipment {
      position: absolute;
      bottom: 60px;
      left: 5%;
      width: 120px;
      height: 80px;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 4px;
      background: rgba(255,255,255,0.02);
      opacity: 0.25;
    }
    .lab-equipment::before {
      content: '';
      position: absolute;
      top: -15px;
      left: 40px;
      width: 40px;
      height: 15px;
      background: rgba(255,255,255,0.03);
      border-radius: 2px 2px 0 0;
    }
    .lab-equipment-2 {
      position: absolute;
      bottom: 70px;
      right: 8%;
      width: 80px;
      height: 60px;
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 2px;
      background: rgba(255,255,255,0.01);
      opacity: 0.2;
    }

    .ai-confidence {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 11px;
      color: rgba(255,255,255,0.08);
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 2;
      font-weight: 300;
      text-shadow: 0 0 20px rgba(255,150,50,0.05);
    }

    .plant-container {
      position: absolute;
      left: -70px;
      bottom: 60px;
      z-index: 15;
      width: 100px;
      height: 140px;
    }
    .plant-pot {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 58px;
      height: 50px;
      background: linear-gradient(180deg, #e8e4dc, #d4d0c8);
      border-radius: 2px 2px 8px 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .plant-pot::before {
      content: '';
      position: absolute;
      top: -8px;
      left: -6px;
      right: -6px;
      height: 10px;
      background: linear-gradient(180deg, #f0ece4, #e0dcd4);
      border-radius: 3px 3px 0 0;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
    }
    .plant-pot::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 4px;
      right: 4px;
      height: 6px;
      background: linear-gradient(180deg, #c8c4bc, #b8b4ac);
      border-radius: 0 0 6px 6px;
    }
    .plant-stem {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 45px;
      background: linear-gradient(180deg, #5a7a4a, #4a6a3a);
      border-radius: 2px;
    }
    .plant-stem:nth-child(2) {
      transform: translateX(-50%) rotate(-15deg);
      transform-origin: bottom center;
      height: 35px;
      left: 40%;
    }
    .plant-stem:nth-child(3) {
      transform: translateX(-50%) rotate(12deg);
      transform-origin: bottom center;
      height: 40px;
      left: 60%;
    }
    .plant-leaf {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 40% 40%, #7a9a6a, #4a6a3a);
      opacity: 0.85;
    }
    .plant-leaf-1 {
      width: 20px;
      height: 12px;
      bottom: 85px;
      left: 36px;
      transform: rotate(-30deg);
      border-radius: 50% 50% 50% 0;
    }
    .plant-leaf-2 {
      width: 18px;
      height: 10px;
      bottom: 75px;
      left: 52px;
      transform: rotate(20deg);
      border-radius: 50% 50% 0 50%;
    }
    .plant-leaf-3 {
      width: 14px;
      height: 9px;
      bottom: 65px;
      left: 44px;
      transform: rotate(-10deg);
      border-radius: 50%;
    }
    .plant-leaf-4 {
      width: 16px;
      height: 10px;
      bottom: 55px;
      left: 36px;
      transform: rotate(-40deg);
      border-radius: 50% 50% 50% 0;
    }
    .plant-leaf-5 {
      width: 15px;
      height: 9px;
      bottom: 50px;
      left: 52px;
      transform: rotate(35deg);
      border-radius: 50% 50% 0 50%;
    }

    .mouse-container {
      position: absolute;
      right: -90px;
      bottom: 50px;
      z-index: 15;
      width: 100px;
      height: 130px;
    }
    .mouse-body {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 75px;
      background: linear-gradient(180deg, #2a2a30, #1a1a20, #222228);
      border-radius: 25px 25px 20px 20px;
      box-shadow:
        0 8px 25px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .mouse-body::before {
      content: '';
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.06);
      border-radius: 7px;
    }
    .mouse-body::after {
      content: '';
      position: absolute;
      top: 38px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 1px;
    }
    .mouse-cable {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 20px;
      background: rgba(255,255,255,0.04);
      border-radius: 1px;
    }

    .desktop-icons {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .desktop-icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .desktop-icon-item:hover {
      opacity: 1;
    }
    .desktop-icon-item svg {
      width: 28px;
      height: 28px;
      fill: rgba(255,255,255,0.6);
    }
    .desktop-icon-item span {
      font-size: 9px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* ZYRA overlay - React app panel */
    .zyra-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 600px;
      z-index: 5;
      background: rgba(12, 12, 20, 0.85);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
  </style>
<script defer src="renderer.js"></script></head>
<body>

      <div class="desktop-icons">
        <div class="desktop-icon-item">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>

  <script>
    (function() {
      const canvas = document.getElementById('three-canvas');
      if (!canvas) return;
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
      camera.position.set(0, 1, 7);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000000, 0);

      function resizeRenderer() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        if (renderer.domElement.width !== w || renderer.domElement.height !== h) {
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
      }

      // --- Create Holographic Sphere ---
      const sphereGroup = new THREE.Group();

      // Outer wireframe sphere
      const sphereGeo = new THREE.SphereGeometry(1.8, 32, 32);
      const wireframeMat = new THREE.MeshBasicMaterial({
        color: 0xff8833,
        wireframe: true,
        transparent: true,
        opacity: 0.25,
      });
      const wireframeSphere = new THREE.Mesh(sphereGeo, wireframeMat);
      sphereGroup.add(wireframeSphere);

      // Inner wireframe sphere (rotated)
      const innerSphere = new THREE.Mesh(
        new THREE.SphereGeometry(1.5, 24, 24),
        new THREE.MeshBasicMaterial({
          color: 0xffaa44,
          wireframe: true,
          transparent: true,
          opacity: 0.15,
        })
      );
      sphereGroup.add(innerSphere);

      // Glowing core
      const coreGeo = new THREE.SphereGeometry(0.6, 16, 16);
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0xff8822,
        transparent: true,
        opacity: 0.4,
      });
      const core = new THREE.Mesh(coreGeo, coreMat);
      sphereGroup.add(core);

      // --- Orbital Rings ---
      function createRing(radius, color, opacity, tiltX, tiltZ) {
        const ringGeo = new THREE.TorusGeometry(radius, 0.015, 16, 64);
        const ringMat = new THREE.MeshBasicMaterial({
          color: color,
          transparent: true,
          opacity: opacity,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = tiltX;
        ring.rotation.z = tiltZ;
        return ring;
      }

      sphereGroup.add(createRing(2.2, 0xff9944, 0.35, Math.PI / 3, 0));
      sphereGroup.add(createRing(2.4, 0xff8833, 0.25, -Math.PI / 4, Math.PI / 6));
      sphereGroup.add(createRing(2.0, 0xffbb55, 0.3, Math.PI / 2, Math.PI / 4));

      // --- Connected Nodes ---
      const nodeCount = 48;
      const nodePositions = [];
      for (let i = 0; i < nodeCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 1.6 + Math.random() * 0.4;
        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta);
        const z = r * Math.cos(phi);
        nodePositions.push({ x, y, z });
      }

      const nodeMat = new THREE.PointsMaterial({
        color: 0xffaa44,
        size: 0.04,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
      });
      const nodeGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(nodePositions.length * 3);
      nodePositions.forEach((p, i) => {
        positions[i * 3] = p.x;
        positions[i * 3 + 1] = p.y;
        positions[i * 3 + 2] = p.z;
      });
      nodeGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const nodePoints = new THREE.Points(nodeGeo, nodeMat);
      sphereGroup.add(nodePoints);

      // --- Connection lines between nearby nodes ---
      const lineMat = new THREE.LineBasicMaterial({
        color: 0xff8833,
        transparent: true,
        opacity: 0.12,
      });

      for (let i = 0; i < nodePositions.length; i++) {
        for (let j = i + 1; j < nodePositions.length; j++) {
          const dx = nodePositions[i].x - nodePositions[j].x;
          const dy = nodePositions[i].y - nodePositions[j].y;
          const dz = nodePositions[i].z - nodePositions[j].z;
          const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
          if (dist < 0.8 && Math.random() < 0.3) {
            const lineGeo = new THREE.BufferGeometry();
            const verts = new Float32Array([
              nodePositions[i].x, nodePositions[i].y, nodePositions[i].z,
              nodePositions[j].x, nodePositions[j].y, nodePositions[j].z,
            ]);
            lineGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
            const line = new THREE.Line(lineGeo, lineMat);
            sphereGroup.add(line);
          }
        }
      }

      // --- Outer glow particles ---
      const particleCount = 800;
      const particleGeo = new THREE.BufferGeometry();
      const particlePos = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 2.6 + Math.random() * 1.2;
        particlePos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        particlePos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        particlePos[i * 3 + 2] = r * Math.cos(phi);
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
      const particleMat = new THREE.PointsMaterial({
        color: 0xffaa44,
        size: 0.015,
        transparent: true,
        opacity: 0.2,
        blending: THREE.AdditiveBlending,
      });
      const particles = new THREE.Points(particleGeo, particleMat);
      sphereGroup.add(particles);

      // --- Data ring (equatorial) ---
      const dataRingGeo = new THREE.TorusGeometry(2.0, 0.008, 8, 80);
      const dataRingMat = new THREE.MeshBasicMaterial({
        color: 0xffcc66,
        transparent: true,
        opacity: 0.2,
      });
      const dataRing = new THREE.Mesh(dataRingGeo, dataRingMat);
      dataRing.rotation.x = Math.PI / 2;
      sphereGroup.add(dataRing);

      // Second data ring tilted
      const dataRing2 = new THREE.Mesh(
        new THREE.TorusGeometry(2.15, 0.006, 8, 80),
        new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.15 })
      );
      dataRing2.rotation.x = Math.PI / 3;
      dataRing2.rotation.z = Math.PI / 5;
      sphereGroup.add(dataRing2);

      sphereGroup.position.y = 0.2;
      scene.add(sphereGroup);

      // --- Glow halo behind sphere ---
      const glowGeo = new THREE.SphereGeometry(2.4, 24, 24);
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0xff6622,
        transparent: true,
        opacity: 0.04,
      });
      const glowSphere = new THREE.Mesh(glowGeo, glowMat);
      glowSphere.position.y = 0.2;
      scene.add(glowSphere);

      const glowGeo2 = new THREE.SphereGeometry(3.0, 24, 24);
      const glowMat2 = new THREE.MeshBasicMaterial({
        color: 0xff4400,
        transparent: true,
        opacity: 0.02,
      });
      const glowSphere2 = new THREE.Mesh(glowGeo2, glowMat2);
      glowSphere2.position.y = 0.2;
      scene.add(glowSphere2);

      // --- Central warm light ---
      const light = new THREE.PointLight(0xff8833, 0.5, 10);
      light.position.set(0, 0.2, 2);
      scene.add(light);

      let time = 0;

      function animate() {
        requestAnimationFrame(animate);
        time += 0.005;

        resizeRenderer();

        sphereGroup.rotation.y = time * 0.3;
        sphereGroup.rotation.x = Math.sin(time * 0.1) * 0.05;
        sphereGroup.rotation.z = Math.sin(time * 0.08) * 0.03;

        innerSphere.rotation.x = time * 0.15;
        innerSphere.rotation.z = time * 0.1;

        core.scale.setScalar(1 + Math.sin(time * 2) * 0.05);
        coreMat.opacity = 0.35 + Math.sin(time * 1.5) * 0.1;

        dataRing.rotation.z = time * 0.2;
        dataRing2.rotation.z = time * 0.15;
        dataRing2.rotation.y = time * 0.1;

        renderer.render(scene, camera);
      }

      animate();

      // Handle resize
      window.addEventListener('resize', resizeRenderer);
      setInterval(resizeRenderer, 500);

      // Update clock
      function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-US', { hour12: true });
        const dateStr = now.toLocaleDateString('en-GB');
        const timeEl = document.getElementById('clock-time');
        const dateEl = document.getElementById('clock-date');
        if (timeEl) timeEl.textContent = timeStr;
        if (dateEl) dateEl.textContent = dateStr;
      }
      updateClock();
      setInterval(updateClock, 1000);
    })();
  </script>
</body>
</html>
